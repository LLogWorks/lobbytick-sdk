name: Release TypeScript

# Push a tag like `typescript/v0.1.0` to publish typescript/ to npm.
on:
  push:
    tags: ["typescript/v*"]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#typescript/v}"
          pkg="$(node -p 'require("./package.json").version')"
          src="$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' src/version.ts)"
          test "$tag" = "$pkg" && test "$tag" = "$src" || { echo "tag $tag, package.json $pkg, src/version.ts $src"; exit 1; }
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      # With an NPM_TOKEN secret it is used; without one, npm falls back to
      # trusted publishing (configure it on npmjs.com, then delete the secret).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
