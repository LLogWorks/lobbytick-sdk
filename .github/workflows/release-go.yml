name: Release Go

# Go modules are published by the tag itself: push `go/v0.1.0` and
# `go get github.com/LLogWorks/lobbytick-sdk/go@v0.1.0` works. This only tests
# the tagged code and asks the Go module proxy to fetch it right away.
on:
  push:
    tags: ["go/v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Tag matches SDKVersion
        run: |
          tag="${GITHUB_REF_NAME#go/v}"
          src="$(sed -n 's/^const SDKVersion = "\(.*\)"/\1/p' client.go)"
          test "$tag" = "$src" || { echo "tag $tag, SDKVersion $src"; exit 1; }
      - run: go vet ./... && go test ./...
      - name: Warm the module proxy
        run: |
          version="${GITHUB_REF_NAME#go/}"
          curl -fsS "https://proxy.golang.org/github.com/%21l%21log%21works/lobbytick-sdk/go/@v/${version}.info"
