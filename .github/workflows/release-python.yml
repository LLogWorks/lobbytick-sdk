name: Release Python

# Push a tag like `python/v0.1.0` to publish python/ to PyPI (trusted publishing).
on:
  push:
    tags: ["python/v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#python/v}"
          src="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/lobbytick_gamedata/_version.py)"
          test "$tag" = "$src" || { echo "tag $tag, _version.py $src"; exit 1; }
      - run: pip install -e '.[dev]' build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
